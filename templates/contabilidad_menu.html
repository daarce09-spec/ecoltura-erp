{% extends "base.html" %}
{% block title %}Contabilidad{% endblock %}
{% block content %}

<style>
    .cont-wrapper { width: 100%; max-width: 900px; margin: 0 auto; text-align: center; }
    .cont-title { font-size: 2.4rem; font-weight: 800; color: #1b4332; margin-bottom: 20px; text-align: center; }
    .cont-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 40px; }
    .cont-opcion {
        background: white; padding: 40px 20px; border-radius: 25px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.05); transition: all 0.4s ease;
        text-decoration: none !important; color: #1b4332;
        display: flex; flex-direction: column; align-items: center;
    }
    .cont-opcion:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
    .cont-icon { font-size: 3.5rem; color: #2d6a4f; margin-bottom: 15px; }
    .cont-name { font-size: 1.3rem; font-weight: 700; }
    @media(max-width: 900px) { .cont-grid { grid-template-columns: 1fr 1fr; } }
    @media(max-width: 560px) { .cont-grid { grid-template-columns: 1fr; } }
</style>

<div class="cont-wrapper">

    <div class="cont-title">Contabilidad</div>

    <div class="cont-grid">

        <a href="{{ url_for('contabilidad_bp.catalogo') }}" class="cont-opcion">
            <i class="bi bi-diagram-3 cont-icon"></i>
            <div class="cont-name">Catálogo de cuentas</div>
        </a>

        <a href="{{ url_for('contabilidad_bp.movimientos') }}" class="cont-opcion">
            <i class="bi bi-plus-circle cont-icon"></i>
            <div class="cont-name">Ingresar movimiento</div>
        </a>

        <a href="{{ url_for('contabilidad_bp.estado_resultados') }}" class="cont-opcion">
            <i class="bi bi-bar-chart-line cont-icon"></i>
            <div class="cont-name">Estado de resultados</div>
        </a>

    </div>

</div>

{% endblock %}
