<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ecoltura</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ecoltura">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v=2">
<link rel="icon" href="/static/img/icon-512.png">
<link rel="manifest" href="/static/manifest-admin.json">
<meta name="theme-color" content="#3E6B22">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#f1f5ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#1f2d1f}
  .caja{width:100%;max-width:360px;margin:16px;background:#fff;border-radius:16px;
        padding:28px 24px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
  .caja img{width:84px;height:84px;border-radius:18px;margin-bottom:8px}
  h1{font-size:20px;margin:4px 0 18px}
  label{display:block;text-align:left;font-size:13px;font-weight:600;margin:12px 0 4px}
  input{width:100%;padding:12px;font-size:16px;border:1px solid #cfd8c8;border-radius:10px}
  input:focus{outline:2px solid #4c8a3c;border-color:#4c8a3c}
  button{width:100%;margin-top:18px;padding:13px;font-size:16px;font-weight:700;color:#fff;
         background:#3f7d32;border:0;border-radius:10px;cursor:pointer}
  .error{background:#fdecea;color:#b3261e;border-radius:8px;padding:10px;font-size:14px;margin-bottom:6px}
  small{display:block;margin-top:14px;color:#6b7a66}
</style>
</head>
<body>
{% if ENTORNO_PRUEBAS %}<div style="position:fixed;top:0;left:0;right:0;background:#e67e00;color:#fff;font:700 12px/22px sans-serif;text-align:center">ENTORNO DE PRUEBAS — los datos no son reales</div>{% endif %}
<div id="intro" style="position:fixed;inset:0;z-index:2000;background:#2E5117;display:flex;flex-direction:column;
     align-items:center;justify-content:center;gap:18px;transition:opacity .7s ease, visibility .7s ease;">
  <div style="font-weight:800;color:#fff;font-size:clamp(2.2rem,9vw,4rem);letter-spacing:clamp(8px,2.5vw,18px);text-indent:8px;">ECOLTURA</div>
  <div style="width:56px;height:2px;background:#A4C93C;"></div>
  <div style="font-size:clamp(.6rem,2.5vw,.72rem);letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:600;">Administración</div>
</div>
<script>
  // Mismo saludo del menú: se muestra primero y luego aparece el ingreso.
  // Se marca como visto para que el menú no lo repita justo después de entrar.
  (function () {
    var intro = document.getElementById('intro');
    var visto = false;
    try { visto = !!sessionStorage.getItem('ecoltura_intro_vista'); } catch (e) {}
    if (visto) { intro.style.display = 'none'; return; }
    setTimeout(function () { intro.style.opacity = '0'; intro.style.visibility = 'hidden'; intro.style.pointerEvents = 'none'; }, 1700);
    setTimeout(function () { intro.style.display = 'none'; }, 2500);
    try { sessionStorage.setItem('ecoltura_intro_vista', 'true'); } catch (e) {}
  })();
</script>
<form class="caja" method="post" action="/login" hx-boost="false">
  <img src="/static/img/icon-512.png" alt="Ecoltura">
  <h1>Ecoltura · Admin</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <input type="hidden" name="next" value="{{ next }}">
  <label for="usuario">Usuario</label>
  <input id="usuario" name="usuario" autocomplete="username" autocapitalize="none" autocorrect="off" required autofocus>
  <label for="clave">Contraseña</label>
  <input id="clave" name="clave" type="password" autocomplete="current-password" required>
  <button type="submit">Entrar</button>
  <small>Este dispositivo recordará tu sesión por 90 días.</small>
</form>
</body>
</html>
