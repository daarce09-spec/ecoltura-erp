name: Backup diario de base de datos

on:
  schedule:
    - cron: '0 9 * * *'   # 3:00 AM Costa Rica = 9:00 AM UTC
  workflow_dispatch:        # permite correrlo manualmente para probar

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Generar el backup
        run: |
          pg_dump "${{ secrets.DATABASE_URL }}" | gzip > backup_$(date +%Y-%m-%d).sql.gz

      - name: Clonar repo de backups
        run: |
          git clone https://x-access-token:${{ secrets.BACKUP_REPO_TOKEN }}@github.com/daarce09-spec/ecoltura-backups.git repo_backups

      - name: Copiar y subir el backup
        run: |
          cp backup_*.sql.gz repo_backups/
          cd repo_backups
          git config user.name "Backup Bot"
          git config user.email "backup@ecoltura.local"
          git add .
          git diff --staged --quiet || git commit -m "Backup automático $(date +%Y-%m-%d)"
          git push
